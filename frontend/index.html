<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Instagram Mutuals</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="app">
  <header>
    <h1>Instagram Mutuals</h1>
    <p class="subtitle">See who doesn't follow you back — using your own Instagram data export, nothing else.</p>
  </header>

  <section id="upload-section" class="card">
    <div class="field">
      <label for="followers-input">Followers file(s)</label>
      <input type="file" id="followers-input" accept=".html" multiple />
      <span class="hint">followers_1.html (and followers_2.html, etc. if you have more than one)</span>
    </div>

    <div class="field">
      <label for="following-input">Following file</label>
      <input type="file" id="following-input" accept=".html" />
      <span class="hint">following.html</span>
    </div>

    <button id="analyze-btn">Analyze</button>
    <p id="error-msg" class="error hidden"></p>
  </section>

  <section id="results-section" class="hidden">
    <div class="stats">
      <div class="stat"><span id="stat-followers" class="stat-number">0</span><span class="stat-label">Followers</span></div>
      <div class="stat"><span id="stat-following" class="stat-number">0</span><span class="stat-label">Following</span></div>
      <div class="stat"><span id="stat-mutuals" class="stat-number">0</span><span class="stat-label">Mutuals</span></div>
      <div class="stat"><span id="stat-not-back" class="stat-number">0</span><span class="stat-label">Not following you back</span></div>
      <div class="stat"><span id="stat-you-not-back" class="stat-number">0</span><span class="stat-label">You don't follow back</span></div>
    </div>

    <input type="text" id="search-input" placeholder="Search usernames..." />

    <div class="tabs">
      <button class="tab-btn active" data-tab="not-following-back">Not following you back</button>
      <button class="tab-btn" data-tab="you-not-following-back">You don't follow back</button>
      <button class="tab-btn" data-tab="mutuals">Mutuals</button>
    </div>

    <ul id="list-not-following-back" class="user-list"></ul>
    <ul id="list-you-not-following-back" class="user-list hidden"></ul>
    <ul id="list-mutuals" class="user-list hidden"></ul>
  </section>
</div>

<script src="app.js"></script>
</body>
</html>
